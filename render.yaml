# Render Blueprint: New > Blueprint > pick this repo. Render reads this file and creates the service.
services:
  - type: web
    name: disease-to-target-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true # redeploy on every push to the default branch
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GROQ_API_KEY
        sync: false # Render asks you to paste it; it never goes into git
      - key: NCBI_EMAIL
        sync: false
